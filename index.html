<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Suppress Vite HMR WebSocket disconnection errors and media decode fallback notices in sandbox iframe environment
      window.addEventListener('error', function(e) {
        const msg = e.message || '';
        if (msg.includes('WebSocket') || msg.includes('supported sources') || msg.includes('MEDIA_ELEMENT_ERROR') || e.filename?.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        const msg = e.reason?.message || String(e.reason || '');
        if (msg.includes('WebSocket') || msg.includes('supported sources')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
    <title>ON AIR – Wedding Stories</title>
    <meta name="description" content="Mobile-first wedding guest PWA with live streaming, AI selfie photo matching, albums, schedules, and wishes." />
    <meta property="og:title" content="ON AIR – Wedding Stories" />
    <meta property="og:description" content="Mobile-first wedding guest PWA with live streaming, AI selfie photo matching, albums, schedules, and wishes." />
